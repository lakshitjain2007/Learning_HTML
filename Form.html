<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete HTML Form</title>
</head>
<body>

    <h1>Complete HTML Form</h1>

    <form>

        <!-- Text Inputs -->
        <fieldset>
            <legend>Text Inputs</legend>

            <label>Full Name:</label>
            <input type="text" value="">
            <br><br>

            <label>Email:</label>
            <input type="email" placeholder="example@gmail.com">
            <br><br>

            <label>Password:</label>
            <input type="password">
            <br><br>

            <label>Search:</label>
            <input type="search" placeholder="Search here">
            <br><br>

            <label>Phone:</label>
            <input type="tel" placeholder="9876543210">
            <br><br>

            <label>Website:</label>
            <input type="url" placeholder="https://example.com">

        </fieldset>

        <br>

        <!-- Number Inputs -->
        <fieldset>
            <legend>Number Inputs</legend>

            <label>Age:</label>
            <input type="number" value="20">
            <br><br>

            <label>Volume:</label>
            <input type="range">

        </fieldset>

        <br>

        <!-- Date & Time Inputs -->
        <fieldset>
            <legend>Date & Time Inputs</legend>

            <label>Date:</label>
            <input type="date">
            <br><br>

            <label>Time:</label>
            <input type="time">
            <br><br>

            <label>Date & Time:</label>
            <input type="datetime-local">
            <br><br>

            <label>Month:</label>
            <input type="month">
            <br><br>

            <label>Week:</label>
            <input type="week">

        </fieldset>

        <br>

        <!-- Choice Inputs -->
        <fieldset>
            <legend>Choice Inputs</legend>

            <p>Gender:</p>

            <input type="radio" name="gender">
            <label>Male</label>

            <input type="radio" name="gender">
            <label>Female</label>

            <br><br>

            <p>Skills:</p>

            <input type="checkbox" checked>
            <label>HTML</label>

            <input type="checkbox" checked>
            <label>CSS</label>

            <input type="checkbox" checked>
            <label>JavaScript</label>

            <br><br>

            <label>City:</label>
            <select>
                <option>Mumbai</option>
                <option>Delhi</option>
                <option>Vadodara</option>
                <option>Udaipur</option>
            </select>

            <br><br>

            <label>Browser:</label>
            <input list="browsers">

            <datalist id="browsers">
                <option value="Chrome">
                <option value="Firefox">
                <option value="Edge">
                <option value="Safari">
            </datalist>

        </fieldset>

        <br>

        <!-- File & Color Inputs -->
        <fieldset>
            <legend>File & Color Inputs</legend>

            <label>Upload File:</label>
            <input type="file">
            <br><br>

            <label>Favorite Color:</label>
            <input type="color">

        </fieldset>

        <br>

        <!-- Textarea -->
        <fieldset>
            <legend>Textarea</legend>

            <label>Message:</label>
            <br>

            <textarea rows="6" cols="50" placeholder="Write something..."></textarea>

        </fieldset>

        <br>

        <!-- Buttons -->
        <input type="submit" value="Submit">

        <input type="reset" value="Reset">

        <button type="button">Normal Button</button>

    </form>

</body>
</html>
